<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA Cliente VIP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .portal-layout { max-width: 1000px; margin: 40px auto; padding: 20px; }
        .auth-container { max-width: 400px; margin: 100px auto; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group input { width: 100%; padding: 1rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: white; font-size: 1rem; }
        .welcome-card { background: var(--card-bg); padding: 3rem; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div class="glass-bg"></div>
    <nav>
        <div class="logo">ARIA <span>Client VIP</span></div>
        <div class="nav-links">
            <a href="/">Volver al Sitio</a>
        </div>
    </nav>
    
    <div id="login-view" class="auth-container">
        <div class="glass-card" style="text-align: center;">
            <div style="font-size: 3rem; margin-bottom: 1.5rem;">🗝️</div>
            <h2 style="font-family: var(--font-heading); font-size: 2rem; margin-bottom: 0.5rem; color: var(--gold);">Acceso Exclusivo</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2.5rem;">Portal de Clientes VIP — New Listing SV</p>
            
            <div class="form-group" style="margin-bottom: 1rem;">
                <input type="email" id="email" placeholder="Correo Electrónico" class="luxury-input">
            </div>
            <div class="form-group" style="margin-bottom: 2rem;">
                <input type="password" id="password" placeholder="Su Contraseña" class="luxury-input">
            </div>
            
            <button class="btn-gold" style="width: 100%;" onclick="loginClient()">Entrar a mi Bóveda</button>
            <p id="login-error" style="color: #ff6b6b; margin-top: 1.5rem; font-size: 0.85rem; display: none;"></p>
        </div>
    </div>

    <div id="dashboard-view" class="portal-layout" style="display:none;">
        <div class="glass-card welcome-card">
            <h1 style="font-family: var(--font-heading); font-size: 2.8rem; color: var(--gold); margin-bottom: 1rem;">Bienvenido, Cliente VIP.</h1>
            <p style="max-width: 600px; margin: 0 auto 3rem; color: var(--text-muted); line-height: 1.6;">Este es su espacio privado donde la inteligencia de ARIA almacena sus análisis personalizados, favoritos y conversaciones pasadas.</p>
            
            <div style="display: flex; justify-content: center; gap: 2rem; margin-top: 2rem; flex-wrap: wrap;">
                <div class="glass-card" style="padding: 2rem; width: 220px; border-color: rgba(200, 169, 126, 0.2);">
                    <h3 style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted);">Favoritos</h3>
                    <div style="font-size: 2.5rem; color: var(--gold); margin-top: 0.5rem; font-family: var(--font-heading);">0</div>
                </div>
                <div class="glass-card" style="padding: 2rem; width: 220px; border-color: rgba(200, 169, 126, 0.2);">
                    <h3 style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted);">Conversaciones</h3>
                    <div style="font-size: 2.5rem; color: var(--gold); margin-top: 0.5rem; font-family: var(--font-heading);">1</div>
                </div>
            </div>
            
            <div style="margin-top: 4rem;">
                <button class="btn-outline" onclick="logout()">Cerrar Portal Seguro</button>
            </div>
        </div>
    </div>

    <script>
        function checkAuth() {
            const token = localStorage.getItem('aria_token');
            const role = localStorage.getItem('aria_role');
            if(token && role === 'CLIENT') {
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('dashboard-view').style.display = 'block';
            } else {
                document.getElementById('login-view').style.display = 'block';
                document.getElementById('dashboard-view').style.display = 'none';
            }
        }

        async function loginClient() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                const data = await res.json();
                if(data.token && data.user.role === 'CLIENT') {
                    localStorage.setItem('aria_token', data.token);
                    localStorage.setItem('aria_role', data.user.role);
                    checkAuth();
                } else {
                    document.getElementById('login-error').innerText = data.error || 'Credenciales inválidas para cliente.';
                    document.getElementById('login-error').style.display = 'block';
                }
            } catch(e) { console.error(e); }
        }

        function logout() {
            localStorage.removeItem('aria_token');
            localStorage.removeItem('aria_role');
            checkAuth();
        }

        checkAuth();
    </script>
</body>
</html>
